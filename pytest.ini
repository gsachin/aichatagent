[pytest]
# Keeps a bare `pytest` to the suite. Without this it also collects
# doc/perf/tools/test_*.py, which are standalone scripts, not test modules: no
# test functions, no __main__ guard, they print their own tally and end in
# `sys.exit()`. Importing the first one therefore aborts the session with an
# INTERNALERROR before a single test runs, which is how `pytest` came to look
# like a repo with nothing to run.
#
# Those tools are run directly, as their own docs say:
#   ./.venv/Scripts/python.exe doc/perf/tools/test_us001_tracer.py
# and naming a path still overrides testpaths, for real test modules.
#
# The suite is not all green yet, and this makes that visible rather than leaving
# it hidden behind the abort: five tests in tests/test_offer_readiness.py are
# `@pytest.mark.asyncio`, and pytest-asyncio is not installed in this venv (only
# anyio), so pytest refuses them at the plugin level.
testpaths = tests
