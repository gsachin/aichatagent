version: '3.9'

################################################################################
# Docker Compose - University Admissions Voice AI Assistant
################################################################################
# Services:
# 1. Postgres - admissions database
# 2. FastAPI - Backend API server (OpenAI LLM, document context)
# 3. Streamlit - Web UI frontend
#
# Usage:
#   docker-compose up -d                # Start all services
#   docker-compose down                 # Stop all services
#   docker-compose logs -f fastapi      # View logs
################################################################################

services:
  # ──────────────────────────────────────────────────────────────────
  # PostgreSQL 16 + pgvector — Admissions database
  # ──────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    # elearning-postgres: matches every launcher script's `docker exec`
    # probe (start_services.ps1 / check_and_tunnel.ps1 / bootstrap_services).
    container_name: elearning-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=elearning
      - POSTGRES_PASSWORD=elearning_secret
      - POSTGRES_DB=admissions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "elearning", "-d", "admissions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - voice-network

  # ──────────────────────────────────────────────────────────────────
  # FastAPI - Backend Server
  # ──────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Containers must not drift-check against the host's machine snapshot
      - MACHINE_PROFILE_CHECK=0
      - PYTHONDONTWRITEBYTECODE=1
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - LOG_LEVEL=info
      # DB + integrations come from the project .env (compose auto-loads it
      # for substitution) — the app container must talk to the postgres
      # SERVICE host, not localhost.
      - DATABASE_URL=${DATABASE_URL:-postgresql://elearning:elearning_secret@postgres:5432/admissions}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # Sentiment analysis scoring weights (tune for your business)
      - SENTIMENT_W1=0.30
      - SENTIMENT_W2=0.30
      - SENTIMENT_W3=0.25
      - SENTIMENT_W4=0.15
      - SENTIMENT_EWMA_LAMBDA=0.35
      - MIN_LABELED_OUTCOMES=100
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voice-network
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────
  # Streamlit - Web UI
  # ──────────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Containers must not drift-check against the host's machine snapshot
      - MACHINE_PROFILE_CHECK=0
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://elearning:elearning_secret@postgres:5432/admissions}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - voice-network
    command: streamlit run app.py --server.port 8501 --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────
  # Streamlit - Command Cockpit Dashboard (admin)
  # ──────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-dashboard
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Containers must not drift-check against the host's machine snapshot
      - MACHINE_PROFILE_CHECK=0
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://elearning:elearning_secret@postgres:5432/admissions}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8502
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - voice-network
    command: streamlit run dashboard.py --server.port 8502 --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

################################################################################
# Networks
################################################################################
networks:
  voice-network:
    driver: bridge

################################################################################
# Volumes
################################################################################
volumes:
  postgres_data:
    driver: local
